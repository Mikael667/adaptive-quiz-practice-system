spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/adaptive_quiz}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:quiz_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

# Hibernate JPA settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false